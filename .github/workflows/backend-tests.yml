name: Backend tests

on:
  push:
  pull_request:

jobs:
  provider-write-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: new_gorisons
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d new_gorisons"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/new_gorisons

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install, migrate and run request workflow tests
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx vitest run src/requests/requests.provider-write-race.integration.spec.ts src/requests/requests.cancel-provider-selection.integration.spec.ts src/requests/requests.select-provider.spec.ts
