services:
  postgres:
    image: postgres:17-alpine
    container_name: new-gorisons-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: new_gorisons
    ports:
      - "5421:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d new_gorisons"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
