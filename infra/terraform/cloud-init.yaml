#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git

write_files:
  - path: /opt/zemledel/docker-compose.prod.yml
    permissions: "0644"
    owner: ubuntu:ubuntu
    content: |
      # Скопируйте актуальный deploy/docker-compose.prod.yml при первом выкате
      services: {}

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu
  - mkdir -p /opt/zemledel
  - chown -R ubuntu:ubuntu /opt/zemledel
  - install -m 0755 /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose || true
